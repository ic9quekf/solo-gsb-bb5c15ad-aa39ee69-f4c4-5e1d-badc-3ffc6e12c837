<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编织说明逐行针数校验</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>编织说明逐行针数校验 · 线材用量估算</h1>
    <p class="hint">
      支持记号：<code>k</code>（消耗1/产出1）、<code>p</code>（消耗1/产出1）、
      <code>yo</code>（消耗0/产出1）、<code>k2tog</code>（消耗2/产出1），
      以及可嵌套的 <code>(指令序列)*次数</code>，如 <code>((k yo)*2 k2tog)*3</code>。
      多尺码倍数写作 <code>*{6|8|10}</code>：竖线分隔的正整数按尺码顺序分别取值，
      项数须与尺码个数一致；普通 <code>*n</code> 对所有尺码生效，两种重复可互相嵌套。
      记号可用空格或逗号分隔，大小写不敏感。
    </p>

    <form id="check-form">
      <div class="field">
        <span>尺码与起针数（按顺序，<code>*{...}</code> 依此顺序取值）</span>
        <div id="sizes-list"></div>
        <button type="button" id="add-size" class="small">＋ 添加尺码</button>
      </div>

      <label class="field">
        <span>每行指令（一行一条，各尺码共用）</span>
        <textarea id="pattern" rows="8" spellcheck="false"
          placeholder="(k2tog yo)*{6|8|10}&#10;p*{12|16|20}&#10;(k2tog)*{6|8|10}"></textarea>
      </label>

      <fieldset class="field" id="yarn-fields">
        <legend>线材用量估算（按该尺码实际记号次数累计）</legend>
        <div class="yarn-grid">
          <label>单个 <code>k</code> 克重
            <input type="number" id="weight-k" min="0" step="0.1" value="1" inputmode="decimal" required>
          </label>
          <label>单个 <code>p</code> 克重
            <input type="number" id="weight-p" min="0" step="0.1" value="1" inputmode="decimal" required>
          </label>
          <label>单个 <code>yo</code> 克重
            <input type="number" id="weight-yo" min="0" step="0.1" value="0.3" inputmode="decimal" required>
          </label>
          <label>单个 <code>k2tog</code> 克重
            <input type="number" id="weight-k2tog" min="0" step="0.1" value="2" inputmode="decimal" required>
          </label>
          <label>损耗百分比（%）
            <input type="number" id="waste-percent" min="0" step="1" value="10" inputmode="decimal" required>
          </label>
          <label>每团克重
            <input type="number" id="ball-grams" min="0" step="1" value="50" inputmode="decimal" required>
          </label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit">校验并估算用量</button>
        <button type="button" id="fill-example">填入示例</button>
      </div>
    </form>

    <section id="result" hidden>
      <div id="summary"></div>
      <div id="sizes-results" class="sizes-results"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
